name = "tapeout-public-monitor"
main = "src/worker.js"
compatibility_date = "2026-08-19"
workers_dev = true

[[routes]]
pattern = "tapeout.work"
custom_domain = true

# Workers Paid plan (2026-09-03). Smart Placement runs the Worker near D1 instead of
# at the edge nearest the visitor: every request here makes 3–8 D1 round trips, and
# the baseline from Asia was 0.45–0.7s per endpoint with each trip crossing an ocean.
[placement]
mode = "smart"

# Workers Logs: the write-limit incident on 2026-09-02 was diagnosed by racing a
# `wrangler tail` against a curl; persisted logs make that a query instead.
[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "tapeout-monitor"
database_id = "edf7c21a-3e5f-4e12-a34b-1fe496ce1924"

[triggers]
# One-minute job is deliberately scoped to the volatile third-party BEM/USDT quote.
# The five-minute job remains the cadence for Registry, official snapshots and other domains.
crons = ["* * * * *", "*/5 * * * *"]
